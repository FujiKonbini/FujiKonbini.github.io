<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>富士夜航便利店 · 第一视角</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;user-select:none}
  body{height:100vh;overflow:hidden;background:#050811;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
  #pov{position:relative;width:100vw;height:100vh;overflow:hidden;perspective:900px;background:#090d16}
  .ceiling{position:absolute;top:0;left:-10%;width:120%;height:26%;background:linear-gradient(180deg,#0f172a,#1e293b);transform:rotateX(-25deg);transform-origin:top;display:flex;justify-content:space-around;align-items:center;border-bottom:2px solid #334155}
  .light-bar{width:22%;height:10px;background:#fef9c3;border-radius:99px;box-shadow:0 0 35px #fef08a,0 10px 60px rgba(254,240,138,.4)}
  .floor{position:absolute;bottom:0;left:-10%;width:120%;height:34%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 60px,transparent 60px 120px),linear-gradient(0deg,#060913 0%,#162033 100%);transform:rotateX(35deg);transform-origin:bottom;border-top:2px solid #334155}
  .door-overlay{position:fixed;inset:0;z-index:60;display:flex;pointer-events:none;transition:opacity .6s ease}
  .door-l,.door-r{flex:1;background:rgba(15,23,42,.88);border:2px solid rgba(56,189,248,.4);backdrop-filter:blur(8px);transition:transform 1.1s cubic-bezier(.22,1,.36,1);display:flex;align-items:center;justify-content:center;color:#38bdf8;font-size:14px;letter-spacing:4px}
  .door-open .door-l{transform:translateX(-100%)}
  .door-open .door-r{transform:translateX(100%)}
  .hud{position:fixed;top:16px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;z-index:40}
  .pill-btn{background:rgba(10,14,26,.75);border:1px solid rgba(255,255,255,.18);color:#fff;padding:7px 14px;border-radius:99px;font-size:12px;cursor:pointer;backdrop-filter:blur(12px);transition:.2s}
  .pill-btn:hover{background:#fde047;color:#090d16;border-color:#fde047}
</style>
</head>
<style>
  .stage{position:absolute;inset:14% 6% 22%;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10;transition:transform .4s ease}
  .wall-sign{background:rgba(15,23,42,.9);border:1px solid rgba(253,224,71,.45);padding:6px 22px;border-radius:8px;color:#fde047;font-size:13px;letter-spacing:3px;font-weight:700;margin-bottom:14px;box-shadow:0 0 20px rgba(253,224,71,.15)}
  .rack{width:100%;max-width:780px;background:rgba(15,23,42,.72);border:2px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;backdrop-filter:blur(12px);box-shadow:0 20px 50px rgba(0,0,0,.7),inset 0 0 30px rgba(255,255,255,.04)}
  .shelves{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .slot{background:linear-gradient(180deg,rgba(30,41,59,.8),rgba(9,13,22,.95));border:1px solid rgba(255,255,255,.12);border-bottom:6px solid #475569;border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer;transition:.2s}
  .slot:hover{transform:translateY(-6px) scale(1.03);border-color:#fde047;box-shadow:0 10px 25px rgba(253,224,71,.2)}
  .nav-arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:35;background:rgba(15,23,42,.8);border:1px solid rgba(253,224,71,.4);color:#fde047;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
  .nav-arrow:hover{background:#fde047;color:#090d16;transform:translateY(-50%) scale(1.1)}
  #prevZone{left:14px}
  #nextZone{right:14px}
  .dialog{position:fixed;top:64px;left:50%;transform:translateX(-50%);width:90%;max-width:640px;background:rgba(10,15,28,.85);border:1px solid rgba(253,224,71,.35);border-radius:16px;padding:10px 16px;display:flex;align-items:center;gap:12px;z-index:30;backdrop-filter:blur(12px)}
  .pov-hands{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:96%;max-width:760px;display:flex;justify-content:space-between;align-items:flex-end;z-index:35;pointer-events:none}
  .left-basket{pointer-events:auto;background:rgba(15,23,42,.95);border:2px solid #fde047;border-bottom:none;border-radius:20px 20px 0 0;padding:12px 16px;width:62%;box-shadow:0 -8px 30px rgba(0,0,0,.8)}
  .right-hand{pointer-events:auto;background:rgba(15,23,42,.95);border:1px solid rgba(255,255,255,.2);border-bottom:none;border-radius:20px 20px 0 0;padding:12px 16px;width:35%;text-align:center}
  .bag-row{display:flex;gap:6px;overflow-x:auto;margin:6px 0;min-height:28px;align-items:center;font-size:12px}
  .tag-item{background:rgba(255,255,255,.12);padding:3px 9px;border-radius:99px;white-space:nowrap;cursor:pointer}
  .tag-item:hover{background:#ef4444}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
  .receipt{background:#f8fafc;color:#0f172a;width:100%;max-width:320px;padding:20px;font-family:monospace;border-top:6px dashed #0f172a;border-bottom:6px dashed #0f172a}
</style>
<body>
  <audio id="bgm" loop preload="auto"></audio>
  <div class="door-overlay" id="doors">
    <div class="door-l">自動ドア · OPEN</div>
    <div class="door-r">FUJI KONBINI</div>
  </div>
  <div id="pov">
    <div class="ceiling"><div class="light-bar"></div><div class="light-bar"></div><div class="light-bar"></div></div>
    <div class="floor"></div>
    <div class="hud">
      <button class="pill-btn" onclick="location.href='index.html'">🚪 推门离开便利店</button>
      <div style="font-size:12px;color:#fde047;letter-spacing:2px" id="zoneIndicator">视角 1/4 · 收银台热食柜</div>
      <button class="pill-btn" id="rbtn" onclick="togRadio()">📻 店内BGM</button>
    </div>
    <div class="dialog">
      <div style="font-size:26px" id="avatar">🧑‍🍳</div>
      <div style="font-size:12.5px;line-height:1.5" id="msg">“いらっしゃいませ！”（门铃响起，暖气扑面而来，夜班店员佐藤向你点头致意。）</div>
    </div>
    <button class="nav-arrow" id="prevZone" title="向左转身 (A)" onclick="turn(-1)">◀</button>
    <button class="nav-arrow" id="nextZone" title="向右转身 (D)" onclick="turn(1)">▶</button>
    <div class="stage" id="stage">
      <div class="wall-sign" id="sign">HOT SNACKS · 收银台保温热食柜</div>
      <div class="rack"><div class="shelves" id="shelves"></div></div>
    </div>
    <div class="pov-hands">
      <div class="left-basket">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#fde047;font-weight:700">
          <span>🧺 左手提着的购物篮</span><span id="yen">¥0</span>
        </div>
        <div class="bag-row" id="bag"><span style="color:#64748b">空空如也，伸手点击货架拿取...</span></div>
      </div>
      <div class="right-hand">
        <div style="font-size:11px;color:#94a3b8;margin-bottom:6px" id="handAction">右手空闲中</div>
        <button class="pill-btn" style="background:#fde047;color:#090d16;font-weight:700;width:100%" onclick="checkout()">💴 递给店员结账</button>
      </div>
    </div>
  </div>
  <div class="modal" id="modal">
    <div class="receipt">
      <div style="text-align:center;border-bottom:1px dashed #64748b;padding-bottom:8px;margin-bottom:8px">
        <b>富士夜航便利店 · 領収書</b><br><span style="font-size:11px" id="rTime"></span>
      </div>
      <div id="rList" style="font-size:12px;line-height:1.8"></div>
      <div style="border-top:1px dashed #64748b;margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;font-weight:700">
        <span>お買上げ合計</span><span id="rSum">¥0</span>
      </div>
      <div style="text-align:center;font-size:11px;color:#475569;margin:12px 0">“ありがとうございました！”<br>已装入印有富士山的便利店塑料袋</div>
      <button onclick="donePay()" style="width:100%;padding:8px;background:#0f172a;color:#fff;border:none;border-radius:6px;cursor:pointer">提着袋子继续逛店</button>
    </div>
  </div>
  <script>
    var zIdx=0,bag=[],playing=false;
    var VIEWS=[
      {ind:'视角 1/4 · 收银台热食柜',sign:'HOT SNACKS · 收银台保温热食柜',who:'🧑‍🍳',intro:'你走到收银台前，玻璃保温柜里的关东煮正咕嘟咕嘟冒着热气。',items:[
        {i:'🍢',n:'昆布高汤关东煮',p:380,who:'🧑‍🍳',say:'店员佐藤：“帮您盛了白萝卜、鸡蛋和魔芋丝，多加了一勺热汤！”'},
        {i:'🍗',n:'黄金脆皮炸鸡',p:240,who:'✋',say:'你用夹子夹起一块刚出炉的脆皮炸鸡，装进了防油纸袋里。'},
        {i:'🥟',n:'北海道红豆包',p:160,who:'✋',say:'蒸汽机门拉开一阵白雾，你拿了一个热乎乎的红豆包。'}
      ]},
      {ind:'视角 2/4 · 发光玻璃冷饮柜',sign:'COLD DRINKS · 整面发光冰柜墙',who:'✋',intro:'你转身面对整面发光的玻璃冰柜，拉开柜门时一阵清凉冷气迎面吹来。',items:[
        {i:'🍾',n:'富士山弹珠汽水',p:210,who:'✋',say:'你从冰柜最上层拿出一瓶冰镇弹珠汽水，玻璃瓶身挂着水珠。'},
        {i:'🍵',n:'宇治现磨抹茶拿铁',p:260,who:'✋',say:'你在旁边的自助咖啡机放下杯子，看着浓缩抹茶与热奶泡缓缓融合。'},
        {i:'🍑',n:'深夜白桃微醺酒',p:195,who:'🧑‍🍳',say:'店员佐藤：“买酒的话，结账时请帮我点一下屏幕上的【已满20岁】哦！”'}
      ]},
      {ind:'视角 3/4 · 鲜食饭团甜品柜',sign:'FRESH BENTO · 鲜食饭团与甜品架',who:'✋',intro:'凌晨刚补货的冷藏架上摆满了三角饭团和限定甜品。',items:[
        {i:'🍙',n:'炙烧三文鱼饭团',p:175,who:'✋',say:'你挑了一个最新鲜的三文鱼饭团，海苔包装还是脆脆的。'},
        {i:'🥪',n:'厚蛋烧火腿三明治',p:320,who:'🧑‍🍳',say:'店员佐藤：“这款三明治可以帮您用店里的微波炉加热 20 秒哦。”'},
        {i:'🍮',n:'河口湖焦糖布丁',p:290,who:'✋',say:'你拿了一盒限定焦糖布丁，准备等下配着热咖啡吃。'}
      ]},
      {ind:'视角 4/4 · 门口杂志与伞架',sign:'ENTRANCE · 玻璃自动门与杂志架',who:'💭',intro:'回头望向玻璃自动门外，河口湖的深夜静悄悄的，门旁摆着杂志架。',items:[
        {i:'📖',n:'深夜旅行月刊',p:680,who:'✋',say:'你随手抽出一本旅行杂志，里面附赠了富士山夜航明信片。'},
        {i:'☂️',n:'透明长柄便利店伞',p:750,who:'✋',say:'日本便利店标志性的 65cm 透明长柄伞，撑开能看见整片星空。'},
        {i:'🔥',n:'贴身暖宝宝贴',p:120,who:'✋',say:'夜里山风微凉，你拿了一包暖宝宝放进购物篮。'}
      ]}
    ];
    function renderView(){
      var v=VIEWS.at(zIdx);
      document.getElementById('zoneIndicator').innerText=v.ind;
      document.getElementById('sign').innerText=v.sign;
      document.getElementById('avatar').innerText=v.who;
      document.getElementById('msg').innerText=v.intro;
      document.getElementById('shelves').innerHTML=v.items.map(function(x,i){
        return '<div class="slot" onclick="grab('+i+')">'+
          '<div style="font-size:38px;margin-bottom:6px">'+x.i+'</div>'+
          '<div style="font-size:13px;font-weight:600">'+x.n+'</div>'+
          '<div style="color:#fde047;font-weight:700;font-size:13px;margin-top:6px">¥'+x.p+'</div>'+
        '</div>';
      }).join('');
    }
    function turn(dir){
      zIdx=(zIdx+dir+VIEWS.length)%VIEWS.length;
      var st=document.getElementById('stage');
      st.style.transform='translateX('+(dir>0?'-30px':'30px')+')';
      setTimeout(function(){st.style.transform='translateX(0)';renderView()},120);
    }
    function grab(i){
      var item=VIEWS.at(zIdx).items.at(i);
      bag.push(item);
      document.getElementById('avatar').innerText=item.who;
      document.getElementById('msg').innerText=item.say;
      document.getElementById('handAction').innerText='右手刚拿了：'+item.i+' '+item.n;
      renderBag();
    }
    function drop(i){bag.splice(i,1);renderBag()}
    function renderBag(){
      var box=document.getElementById('bag'),sum=0;
      if(!bag.length){box.innerHTML='<span style="color:#64748b">空空如也，伸手点击货架拿取...</span>';document.getElementById('yen').innerText='¥0';return}
      box.innerHTML=bag.map(function(x,i){sum+=x.p;return '<span class="tag-item" title="点击放回" onclick="drop('+i+')">'+x.i+' '+x.n+' ×</span>'}).join('');
      document.getElementById('yen').innerText='¥'+sum;
    }
    function checkout(){
      if(!bag.length){document.getElementById('msg').innerText='“您的购物篮还是空的哦，先左右看看挑几样吧！”';return}
      var sum=0;
      document.getElementById('rList').innerHTML=bag.map(function(x){sum+=x.p;return '<div style="display:flex;justify-content:space-between"><span>'+x.n+'</span><span>¥'+x.p+'</span></div>'}).join('');
      document.getElementById('rSum').innerText='¥'+sum;
      document.getElementById('rTime').innerText=new Date().toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})+' JST';
      document.getElementById('modal').style.display='flex';
    }
    function donePay(){bag=[];renderBag();document.getElementById('modal').style.display='none';document.getElementById('handAction').innerText='右手提着便利店购物袋';document.getElementById('msg').innerText='结账完成！你提着热乎乎的便利店购物袋，随时可以推门离开或继续逛逛。'}
    function togRadio(){
      var b=document.getElementById('bgm'),btn=document.getElementById('rbtn');
      if(playing){b.pause();playing=false;btn.innerText='📻 店内BGM';return}
      b.src=['https:/','stream.zeno.fm','0r0xa792kwzuv'].join('/');
      b.play().then(function(){playing=true;btn.innerText='📻 BGM · LIVE'}).catch(function(){});
    }
    function chime(){
      try{
        var c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();
        o.type='sine';o.frequency.setValueAtTime(659,c.currentTime);o.frequency.setValueAtTime(523,c.currentTime+0.18);
        g.gain.setValueAtTime(0.08,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.5);
        o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.5);
      }catch(e){}
    }
    document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='a')turn(-1);if(e.key==='ArrowRight'||e.key==='d')turn(1)});
    renderView();
    window.onload=function(){
      setTimeout(function(){document.getElementById('doors').classList.add('door-open')},150);
      setTimeout(function(){document.getElementById('doors').style.display='none'},1300);
      chime();togRadio();
      document.addEventListener('click',function u(){chime();if(!playing)togRadio();document.removeEventListener('click',u)},true);
    };
  </script>
</body>
</html>
